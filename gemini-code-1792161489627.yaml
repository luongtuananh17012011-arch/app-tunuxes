name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Release App with Ad-Hoc Signature
        run: |
          xcodebuild clean build \
            -project TunaProxy.xcodeproj \
            -scheme TunaProxy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TunaProxy.app Payload/
          zip -r9 TunaProxy.ipa Payload

      - name: Upload TunaProxy.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TunaProxy-IPA
          path: TunaProxy.ipa